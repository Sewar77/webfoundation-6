<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>List</title>
  </head>
  <body>
    <div>
      <h2>Shopping List</h2>
      <ul style="list-style-type: square">
        <li>chicken</li>
        <li>fruits</li>
        <li>tomato</li>
        <li>watermelon</li>
      </ul>
    </div>

    <div>
      <h2>To do list</h2>
      <ol style="list-style-type: georgian">
        <li>wake up</li>
        <li>wash face</li>
        <li>change clothes</li>
        <li>tide up the room</li>
      </ol>
    </div>

    <div>
      <dl>
        <dt>bed</dt>
        <dd>pink red with pillows</dd>
        <dd>pink red with pillows</dd>

        <dt>carpet</dt>
        <dd>red carpet</dd>
      </dl>
    </div>
  </body>
</html>
